version: '3'

tasks:
  envs:op:
    desc: Process .env.op with 1Password CLI
    generates:
      - .env
    cmds:
      - op inject -f --account my.1password.com -i .env.op -o .env

  docs:build:
    desc: Build the user page (docs/_all.md) and arch page (docs/arch/_all.md) from NN-*.md
    cmd: bun docs/_review/build_docs.ts

  docs:
    desc: Build the single page, then serve at http://127.0.0.1:8800
    deps: [docs:build]
    cmd: bun docs/_review/server.ts
