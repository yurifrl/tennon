{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "tennon.fullname" . }}
  labels:
    {{- include "tennon.labels" . | nindent 4 }}
rules:
  # Own CRD objects: connectors, policies, identities, tokens, capability profiles.
  - apiGroups: ["tennon.io"]
    resources: ["*"]
    verbs: ["*"]
  # Connector workloads + their credentials/wiring.
  - apiGroups: [""]
    resources: ["secrets", "configmaps", "services", "pods", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # CRD self-install on first run.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  {{- if .Values.rbac.capabilityEnforcers }}
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["security.kubearmor.com"]
    resources: ["kubearmorpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "tennon.fullname" . }}
  labels:
    {{- include "tennon.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "tennon.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "tennon.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Leader election for replicaCount > 1.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "tennon.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tennon.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "tennon.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tennon.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "tennon.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "tennon.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
