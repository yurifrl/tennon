apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tennon.fullname" . }}
  labels:
    {{- include "tennon.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "tennon.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tennon.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "tennon.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: tennon
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - --store={{ .Values.store.backend }}
            - --api-addr=:{{ .Values.service.apiPort }}
            - --proxy-addr=:{{ .Values.service.proxyPort }}
            {{- if .Values.oidc.issuer }}
            - --oidc-issuer={{ .Values.oidc.issuer }}
            - --oidc-client-id={{ .Values.oidc.clientId }}
            {{- end }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- if eq .Values.store.backend "postgres" }}
            - name: TENNON_STORE_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.store.existingSecret | default (printf "%s-store" (include "tennon.fullname" .)) }}
                  key: dsn
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: api
              containerPort: {{ .Values.service.apiPort }}
            - name: proxy
              containerPort: {{ .Values.service.proxyPort }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: api
          livenessProbe:
            httpGet:
              path: /healthz
              port: api
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
