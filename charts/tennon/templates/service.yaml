apiVersion: v1
kind: Service
metadata:
  name: {{ include "mcphub.fullname" . }}
  labels:
    {{- include "mcphub.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "mcphub.selectorLabels" . | nindent 4 }}
  ports:
    - name: api
      port: {{ .Values.service.apiPort }}
      targetPort: api
    - name: proxy
      port: {{ .Values.service.proxyPort }}
      targetPort: proxy
