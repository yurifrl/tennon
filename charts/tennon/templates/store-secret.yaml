{{- if and (eq .Values.store.backend "postgres") (not .Values.store.existingSecret) .Values.store.postgresDsn -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tennon.fullname" . }}-store
  labels:
    {{- include "tennon.labels" . | nindent 4 }}
type: Opaque
stringData:
  dsn: {{ .Values.store.postgresDsn | quote }}
{{- end }}
