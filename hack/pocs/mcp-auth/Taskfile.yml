version: "3"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  run:glm:
    desc: Start the glm authenticated MCP server (OAuth-protected /mcp on :8787) with Google creds from ../../../../.env
    dir: "{{.TASKFILE_DIR}}/glm"
    dotenv:
      - ../../../../.env
    cmds:
      - npm install
      - npm start

  run:qwen:
    desc: Start the qwen authenticated MCP server (OAuth-protected /mcp on :3000)
    dir: "{{.TASKFILE_DIR}}/qwen"
    dotenv:
      - ../../../../.env
    cmds:
      - npm install
      - npm start

  run:kimi:
    desc: Start the kimi authenticated MCP server (OAuth-protected /mcp on :8787) with Google creds from ../../../../.env
    dir: "{{.TASKFILE_DIR}}/kimi"
    env:
      PORT: "8787"
    dotenv:
      - ../../../../.env
    cmds:
      - npm install
      - npm run dev

  run:claude:
    desc: Start the claude authenticated MCP server (OAuth-protected /mcp on :8791) with Google creds from tennon/.env
    dir: "{{.TASKFILE_DIR}}/claude"
    dotenv:
      - ../../../.env
    env:
      PORT: "8791"
      PUBLIC_URL: "http://localhost:8791"
      JWT_SECRET: airelay-dev-secret
    cmds:
      - npm install
      - npm start

  run:gpt:
    desc: Start the gpt authenticated MCP server (OAuth-protected /mcp on :8792)
    dir: "{{.TASKFILE_DIR}}/gpt"
    dotenv:
      - ../../../.env.op
    cmds:
      - npm install
      - npm start
